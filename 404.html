<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page Not Found - Felipe Coral Sasso</title>
        <meta name="robots" content="noindex" />
        <script>
            (function () {
                document.documentElement.classList.add('js');
                var stored = localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
                    document.documentElement.classList.add('dark');
                }
            })();
        </script>
        <link rel="stylesheet" href="/tailwind.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="bg-[var(--primary-bg)] text-[var(--text-primary)] min-h-screen flex items-center justify-center">
        <div class="text-center px-4">
            <p class="font-display text-8xl font-bold text-[var(--accent-color)] mb-2">404</p>
            <h1 class="font-display text-2xl font-semibold text-[var(--text-primary)] mb-4">Page not found</h1>
            <p class="text-[var(--text-secondary)] mb-8 max-w-sm mx-auto">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a
                href="/"
                class="inline-block bg-[var(--accent-color)] text-[var(--lang-button-active-text)] px-6 py-3 rounded-lg font-medium hover:opacity-90 transition-opacity"
            >
                Back to Portfolio
            </a>
        </div>
    </body>
</html>
